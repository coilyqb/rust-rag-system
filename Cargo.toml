[package]
name = "rust-rag-system"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rust-bert = "0.22"
tch = "0.16"
walker = "0.1"

[profile.release]
opt-level = 3
lto = true